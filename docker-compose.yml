# 판독 서비스 기동.
#
#   docker compose up -d --build
#   curl localhost:8911/healthz
#   curl localhost:8911/config          # source 가 마운트한 파일인지 확인
#
# 임계값을 바꿀 때는 config/default.yaml 만 고치고 restart 한다.
# 이미지를 다시 구울 필요가 없다.

services:
  padreader:
    build: .
    image: padreader:0.1.0
    container_name: padreader
    restart: unless-stopped
    ports:
      - "8911:8911"
    environment:
      PADREADER_CONFIG: /app/config/default.yaml
    volumes:
      # 설정은 읽기 전용으로 붙인다. 서비스가 설정을 쓰는 일은 없다.
      - ./config:/app/config:ro
      # 판독 대상 이미지. /read/path 로 업로드 없이 읽을 때 쓴다.
      - ./data:/data:ro
