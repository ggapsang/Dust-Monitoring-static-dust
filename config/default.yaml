# 참조 패드 판독 모듈 기본 설정
#
# 아직 확정되지 않은 항목은 값을 비워(null) 둔다. null 인 임계값은
# **그 검사를 하지 않는다**는 뜻이며, 산출값 자체는 항상 계산해서 결과에
# 실어 보낸다. 실증에서 그 분포를 보고 값을 채우는 순서다.

# 패드 규격 이름. legacy 가 assets/ 의 실제 도안이다.
spec: legacy

# 정면 보정 출력 한 변의 픽셀 수. 모든 영역 좌표가 이 크기에 도안 기준
# 정규화 좌표를 곱해 결정된다.
pad_size_px: 1120

detect:
  # 이진화 전 가우시안 블러 커널. 0 이면 끈다. 패드를 찾는 데만 쓰고
  # 분진 측정은 원본으로 한다.
  blur_ksize: 5
  # 이미지 전체 면적 대비 패드 후보의 허용 면적비.
  #
  # 4080x3060 화면에서 0.002 는 패드 한 변 158px 에 해당한다. 이보다 큰 값을
  # 쓰면 멀리서 찍힌 사진이 검출 전에 잘린다 - 실촬영에서 219~230px 로 찍힌
  # 패드가 0.005(=250px) 에 걸려 통째로 실패했다. 면적은 1차 거름망일 뿐이고
  # 뒤에 링 구조, 사각형, 채움도, 종횡비, 테두리 규격 검증이 남아 있으므로
  # 낮춰도 오검출로 이어지지 않는다.
  min_pad_area_ratio: 0.002
  max_pad_area_ratio: 0.98
  # approxPolyDP 의 epsilon 을 둘레의 몇 배로 잡을지.
  approx_epsilon_ratio: 0.02
  # 굵은 테두리는 속이 빈 링이라 자식 컨투어를 갖는다. 이 조건을 요구하면
  # 현장의 다른 사각형 물체가 대부분 떨어져 나간다.
  require_ring: true
  min_solidity: 0.85
  max_aspect_ratio: 3.0
  # 네 변의 에지 표본을 뽑을 때 변 끝에서 물러날 비율. 모서리는 인쇄
  # 번짐으로 뭉개져 있어 그 구간을 피한다.
  edge_trim_ratio: 0.15
  # 이진화 임계를 순서대로 시도할 배율. 1.0 이 오츠 그대로다.
  #
  # 화면에서 패드가 작으면 오츠 임계는 패드가 아니라 배경과 바탕면 사이에
  # 잡힌다. 테두리 잉크는 순흑이 아니라 회색이라 그 임계 바로 아래 놓이고,
  # 패드가 밝게 찍히면 테두리 일부가 임계를 넘어 링에 구멍이 뚫려 검출이
  # 실패한다. 그때 임계를 인쇄색 쪽으로 넓혀 다시 본다. 앞의 값으로 찾으면
  # 뒤는 시도하지 않는다.
  threshold_scales: [1.0, 1.15, 1.3, 1.45]
  # 위 배율로 다 못 찾으면 국소 이진화로 한 번 더 본다.
  #
  # 임계 하나를 사진 전체에 쓰면 사진에서 어두운 것은 무엇이든 인쇄색이 된다.
  # 요철 도장면의 그늘이나 패널 이음새가 잉크로 찍히고, 거기 닿은 테두리가
  # 그것들과 한 덩어리가 되어 액자 모양을 잃는다. 화소마다 자기 주변 평균과
  # 견주면 그 결합이 끊어진다 — 벽 그늘은 주변도 같이 그늘이라 제자리에서는
  # 어둡지 않고, 테두리는 바로 옆이 밝은 여백이라 어느 기준으로도 어둡다.
  local_fallback: true
  # '주변' 으로 볼 창 크기. 사진 짧은 변 대비 비율. 테두리 두께보다 넉넉히
  # 커야 창 안에 잉크와 여백이 함께 들어온다.
  local_block_ratio: 0.033
  # 주변 평균보다 이만큼 어두워야(흑색 바탕은 밝아야) 인쇄색으로 친다.
  local_offset: 25
  # 찾은 사각형이 정말 패드 바깥 테두리인지 확인할 때 허용할 두께 오차.
  # 패드 한 변 대비 비율이다. 정면으로 편 이미지에서 잉크 띠가 네 변 모두
  # 0 에서 시작해 규격 두께에서 끝나야 한다. 어긋나면 안쪽 테두리로 다시
  # 맞춘 뒤 규격 두께만큼 밖으로 되짚는다.
  #
  # 검출이 조용히 어긋나는 것을 막는 장치다. 패드가 벽에서 떨어져 그림자가
  # 지면 그림자가 잉크만큼 어두워 패드 끝과 그림자 시작을 밝기로 가를 수 없다.
  # 그러면 사각형은 찾아지지만 한쪽 변이 그림자 속으로 밀려, 검출은 성공으로
  # 보이는데 좌표계가 어긋난 채 틀린 값이 나온다. null 이면 확인하지 않는다.
  border_tolerance: 0.02
  # 국소 이진화 결과에서 지울 선 굵기를 순서대로 시도한다. 0 은 지우지 않음.
  # 주변과 견줘도 진짜 어두운 선(벽 패널 이음새 등)은 남는데, 그것이 패드에
  # 닿아 있으면 테두리와 한 덩어리가 된다. 이음새는 가늘고 테두리는 굵으므로
  # 굵기로 가른다. 크게 잡으면 이음새는 확실히 끊기지만 테두리가 얇게 찍힌
  # 사진에서는 테두리까지 갉으므로, 지우지 않는 쪽부터 필요한 만큼만 지운다.
  local_open_steps: [0, 5, 9]

orient:
  # 비어 있는 모서리와 나머지 세 모서리 사이의 최소 대비.
  # 미달이면 rotation_ambiguous 로 판독 불가. null = 미적용.
  min_margin: null

quality:
  # 에지 10-90% 상승 거리 ÷ 패드 픽셀 크기. 작을수록 선명하다.
  max_edge_rise_ratio: null
  # 원본 테두리 영역 Tenengrad. 클수록 선명하다. 비교용 보조 지표.
  min_tenengrad: null
  max_saturated_bright_ratio: null
  max_saturated_dark_ratio: null
  min_pad_size_px: null
  # 기준 이미지와 판독 이미지의 패드 크기 차이 허용 비율. 두 사진의 패드
  # 크기가 크게 다르면 촬영 위치가 달라진 것이므로 판독 불가로 본다.
  max_pad_size_diff_ratio: null
  # 포화로 볼 화소값. null 이면 포화로 제외하지 않는다. 실증 사진에서
  # 정반사가 실제로 어느 값에 걸리는지 보고 채운다.
  saturation_bright_level: null
  saturation_dark_level: null

normalize:
  # 테두리를 따라 밝기가 변하면 그게 조명 기울기다. 링을 조밀 표본해
  # 평면을 맞추고 그만큼 되돌린다. 여백 화소로는 맞추지 않는다 — 고르게
  # 쌓인 분진까지 조명으로 보고 지워 버린다.
  gradient_correction: true
  # 테두리 링에서 뽑을 표본 점 수. 3자유도 평면에 대해 충분히 커야
  # 잔차가 신뢰도로서 의미를 갖는다.
  ring_samples: 600

dust:
  # localized 배경을 추정할 창 크기. 패드 한 변 대비 비율.
  # 이 창보다 큰 덩어리는 배경으로 흡수되어 가장자리만 잡힌다. 반대로
  # 창을 키우면 조명 변화를 얼룩으로 오인하기 시작한다.
  local_window: 0.08
  # localized 배경보다 이만큼 어두우면 분진으로 본다. 테두리를 1 로 놓은
  # 척도의 값이다. 실증 전 잠정값이다.
  depth_threshold: 0.05
  # 이보다 작은 덩어리는 노이즈로 보고 버린다.
  min_blob_px: 4
  # 여백에서 어느 분위수를 '깨끗한 톤' 으로 볼지. 고르게 퍼진 오염을 잴
  # 때 기준이 된다. 높일수록 민감해지고 낮출수록 둔해진다.
  clean_percentile: 90.0
  # 결과에 담을 덩어리 수. 짙고 큰 순으로 자른다. 고운 분진은 낱알이
  # 수천 개 나오는데 전부 담으면 응답을 읽을 수 없다. 전체 개수는
  # blob_count 로 따로 알린다. null 이면 자르지 않는다.
  max_blobs: 50

score:
  # 스코어가 1.0 이 되는 값. null 이면 원값을 그대로 0-1 로 자른다.
  # 실증 분포를 보고 정할 값이다.
  #
  # uniform  : 기준 대비 밝기 변화의 평균
  # localized: 가장 크고 짙은 덩어리의 면적 비율 x 짙기
  uniform_reference: null
  localized_reference: null

visualize:
  # 분포 이미지에서 빨강이 가리킬 값. 기준 대비 화소 하나가 어두워진 깊이다.
  #
  # 고정해 두어야 두 장을 색으로 바로 견줄 수 있다. null 이면 사진마다 그
  # 안의 최댓값까지 늘려 칠하는데, 그러면 깨끗한 패드도 어딘가는 빨갛게
  # 나와서 색만 보고는 심한지 알 수 없다. 이 값을 넘는 화소는 빨강으로
  # 잘리며, 잘렸는지는 캡션에 실제 최댓값이 같이 찍혀 알 수 있다.
  heat_max: 0.5

lines:
  # 선군 대비는 상시 지표가 아니라 실증 비교용이다.
  enabled: true

target_id:
  enabled: true
  # 기대 자릿수. null 이면 검출된 만큼 읽는다.
  digits: null
  # 숫자 템플릿을 그릴 폰트를 찾을 폴더. 상대 경로는 이 설정 파일이 있는
  # 폴더 기준으로 푼다. 폴더에 TTF/OTF 가 있으면 그것으로 그리고, 없으면
  # 내장 스트로크 폰트로 돈다. 실제 인쇄에 쓴 폰트를 넣어 두면 판독률이
  # 올라간다. 자세한 것은 assets/fonts/README.md 에 있다.
  font_dir: ../assets/fonts

service:
  host: 0.0.0.0
  port: 8911

# 물리 치수. 자료에 없어 비워 둔다. 채우면 mm 환산이 결과에 붙는다.
pad_size_mm: null
